alg_name: AlphaEdit
model_config: ../base/qwen2.5-7b.yaml

layers: [4, 5, 6, 7, 8]
fact_token: subject_last
v_num_grad_steps: 25
v_lr: 5.0e-1
v_loss_layer: 27
v_weight_decay: 1.0e-3
clamp_norm_factor: 4
kl_factor: 0.0625

layer_module_tmp: "model.layers.{}"
rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
ln_f_module: "model.norm"
lm_head_module: "lm_head"

mom2_dataset: wikipedia
mom2_n_samples: 100000
mom2_dtype: float32
stats_dir: data/assets/layer_stats
nullspace_threshold: 2.0e-2
L2: 1
P_loc: data/assets/alpha_edit_projectors/qwen2.5-7b/null_space_project.pt

