alg_name: Mnemo
model_config: ../base/qwen2.5-7b.yaml

online:
  alg_name: R-ROME
  layers: [5]
  fact_token: subject_last
  v_num_grad_steps: 25
  v_lr: 5.0e-1
  v_loss_layer: 27
  v_weight_decay: 1.0e-3
  clamp_norm_factor: 4
  kl_factor: 0.0625
  context_template_length_params: [[5, 10], [10, 10]]
  rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
  layer_module_tmp: "model.layers.{}"
  attn_module_tmp: "model.layers.{}.self_attn"
  mlp_module_tmp: "model.layers.{}.mlp"
  ln_f_module: "model.norm"
  lm_head_module: "lm_head"
  mom2_adjustment: False
  mom2_dataset: wikipedia
  mom2_n_samples: 100000
  mom2_dtype: float32
  stats_dir: ./data/stats
  enable_prompt_keys: False
  enable_random_prefix_keys: True
  original_implementation: False

batch:
  alg_name: AlphaEdit
  layers: [4, 5, 6, 7, 8]
  layer_selection: all
  fact_token: subject_last
  v_num_grad_steps: 25
  v_lr: 5.0e-1
  v_loss_layer: 27
  v_weight_decay: 1.0e-3
  clamp_norm_factor: 4
  kl_factor: 0.0625
  rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
  layer_module_tmp: "model.layers.{}"
  attn_module_tmp: "model.layers.{}.self_attn"
  mlp_module_tmp: "model.layers.{}.mlp"
  ln_f_module: "model.norm"
  lm_head_module: "lm_head"
  mom2_adjustment: True
  mom2_update_weight: 15000
  mom2_dataset: wikipedia
  mom2_n_samples: 100000
  mom2_dtype: float32
  stats_dir: data/layer_stats
  nullspace_threshold: 2.0e-2
  L2: 1
  P_loc: data/alpha_edit_projectors/null_space_project.pt

buffer_capacity: 50
auto_consolidate: True

