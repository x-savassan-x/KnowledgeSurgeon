# Shared configuration for generation.ipynb, judge.ipynb, and hardware.ipynb.

# Selects the base model configuration and evaluation output directory.
model_key: qwen2.5-7b
# model_key: llama3.1-8b
# model_key: qwen3.5-9b

# Methods executed by generation and selected by the judge worker.
editing_methods:
  - ft
  - rome
  - grace
  - r_rome
  - wise
  - alpha_edit
  - mnemo

# Dataset result groups generated and scored by the evaluation pipeline.
result_names:
  - es_loc
  - port

# Cumulative edit counts at which generation snapshots are evaluated.
eval_milestones: [10, 100, 1000, 2000, 5000]

# Total independent benchmark runs represented in result paths.
n_runs: 3

# First run handled by this producer or judge worker.
run_start: 1

# Number of contiguous runs handled; null selects through n_runs.
# Result paths still use the total n_runs value.
run_count: null

# Seed used to derive deterministic run, generation, and judge seeds.
base_seed: 0

generation:
  # Records passed to model.generate in each generation batch.
  batch_size: 256

  async_generation:
    # auto uses asynchronous milestone generation when at least two CUDA GPUs exist.
    # true requires it; false always uses synchronous generation.
    enabled: auto

    # auto selects every visible CUDA device except the editing device.
    devices: auto

    # Methods forced to synchronous generation because their snapshots are unsafe.
    unsafe_methods: []

  model_config:
    # Maximum tokens generated for each evaluation prompt.
    max_new_tokens: 50

    # Deterministic decoding is used when false.
    do_sample: false

    # Strings that terminate generation when encountered.
    stop_strings:
      - "\n"
      - "\\n"

    # Removes leading newline tokens from decoded answers.
    strip_leading_newlines: true

    # Removes stop strings and any text following them from decoded answers.
    truncate_at_stop_strings: true

  # Enables generation progress bars when uncommented.
  # show_pbar: true

  # Retains completed generation progress bars when uncommented.
  # keep_pbar: false

judge:
  # OpenAI-compatible judge server endpoint.
  base_url: http://localhost:8000/v1

  # Authentication value expected by the judge server.
  api_key: local

  # Model served by the judge endpoint.
  model: Qwen/Qwen3.6-35B-A3B-FP8

  # Independent judge passes averaged into each record score.
  repeats: 3

  # Maximum simultaneous API calls while scoring one result file.
  max_concurrency: 50

  # Evaluation records packed into one judge request.
  batch_size: 10

  # Retry attempts for failed records after their initial request.
  max_retries: 5

  # Initial and maximum exponential retry delays in seconds.
  init_retry_delay: 1.0
  max_retry_delay: 10.0

  model_config:
    # Maximum response tokens returned by the judge.
    max_tokens: 64

    # Near-deterministic sampling settings for binary judgments.
    temperature: 0.01
    top_p: 1.0
    presence_penalty: 0.0
    frequency_penalty: 0.0

    # Provider-specific options forwarded unchanged to the judge server.
    extra_body:
      chat_template_kwargs:
        enable_thinking: false

  # Retains completed judge progress bars when uncommented.
  # keep_pbar: false

  # Prints detailed judge activity when uncommented.
  # verbose: false

worker:
  # Continues polling for newly generated unscored files.
  watch: true

  # Seconds between filesystem scans while no work is available.
  poll_interval: 10.0

  # Result files scored concurrently. Approximate simultaneous API calls are
  # file_concurrency * judge.max_concurrency, with judge.batch_size records per call.
  file_concurrency: 1

  # Replaces existing scored files when true.
  overwrite: false

  # Stops watching after every expected filtered result path has been scored.
  stop_when_complete: true

  # Prints worker lifecycle and scheduling messages.
  verbose: true
