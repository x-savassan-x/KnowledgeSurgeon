# Shared evaluation config for edit.ipynb and eval.ipynb.
# Change this file to keep producer and judge-worker settings aligned.

model_name: qwen2.5-7b

editing_methods:
  - ft
  - rome
  - memit
  - grace
  - r_rome
  - wise
  - alpha_edit
  - mnemo

result_names:
  - es_loc
  - port

eval_milestones: [10, 100, 1000, 2000, 5000]

n_runs: 3
# Optional contiguous run subset for parallel machines.
# Paths still use r{n_runs}-j{judge.repeats}; these settings only decide
# which run indices this producer/worker instance handles.
run_start: 1
# null means run from run_start through n_runs.
run_count: null
base_seed: 0

generation:
  batch_size: 512
  async_generation:
    # auto: use async milestone generation only when at least 2 CUDA GPUs are visible.
    # true: require async generation; false: always use synchronous generation.
    enabled: auto
    # auto means all visible CUDA devices except the edit device.
    devices: auto
    # Optional manual fallback list. Leave empty unless a method-specific
    # generation snapshot hook is known to be unsafe.
    unsafe_methods: []
  model_config:
    max_new_tokens: 50
    do_sample: false
    stop_strings:
      - "\n"
    strip_leading_newlines: true
    truncate_at_stop_strings: true
  # show_pbar: true
  # keep_pbar: false

judge:
  base_url: http://localhost:8000/v1
  api_key: local
  model: Qwen/Qwen3.6-35B-A3B-FP8
  repeats: 3
  max_concurrency: 50
  batch_size: 10
  max_retries: 5
  init_retry_delay: 1.0
  max_retry_delay: 10.0
  model_config:
    max_tokens: 64
    temperature: 0.01
    top_p: 1.0
    presence_penalty: 0.0
    frequency_penalty: 0.0
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  # keep_pbar: false
  # verbose: false

worker:
  watch: true
  poll_interval: 10.0
  file_concurrency: 1
  overwrite: false
  stop_when_complete: true
  verbose: true
