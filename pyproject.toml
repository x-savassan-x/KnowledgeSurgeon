[project]
name = "knowledge-surgeon"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    # Data and numerical processing
    "numpy",
    "scipy",
    "pandas",
    "datasets",
    "huggingface_hub",

    # Model editing and retrieval
    "torch",
    "transformers",
    "sentence-transformers",
    "FlagEmbedding",

    # Qwen3.5 accelerated kernels
    "flash-linear-attention; sys_platform == 'linux'",
    "causal-conv1d; sys_platform == 'linux'",

    # Evaluation and visualization
    "openai",
    "tqdm",
    "matplotlib",

    # Notebook and configuration support
    "ipykernel",
    "ipywidgets",
    "python-dotenv",
    "pyyaml",
]


[tool.uv.sources]
torch = { index = "torch-cuda" }


[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
