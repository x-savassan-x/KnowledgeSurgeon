[project]
name = "mnemo"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "datasets",
    "numpy",
    "scipy",
    "nltk",
    "scikit-learn",
    "torch",
    "transformers",
    "openai",
    "regex",
    "pyyaml",
    "tqdm",
    "python-dotenv",
]


[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets"
]


[tool.uv.sources]
torch = { index = "pytorch" }


[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
