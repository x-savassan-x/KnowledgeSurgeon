[project]
name = "mnemo"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    # _____ Data _____
    "datasets",
    "pandas",
    "numpy",
    # _____ AI _____
    "transformers",
    "torch",
    "openai",
    "safetensors",
    # _____ Utils _____
    "ipykernel",
    "ipywidgets",
    "python-dotenv",
    "pyyaml",
    "tqdm",
    "matplotlib",
]


[tool.uv.sources]
torch = { index = "torch-cuda" }


[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
