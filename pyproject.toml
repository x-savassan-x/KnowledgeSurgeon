[project]
name = "knowledge-surgeon"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    # _____ Data _____
    "datasets",
    "huggingface_hub",
    "pandas",
    "numpy",
    "scipy",
    # _____ AI _____
    "transformers",
    "sentence-transformers",
    "FlagEmbedding",
    "torch",
    "flash-linear-attention; sys_platform == 'linux'",
    "causal-conv1d; sys_platform == 'linux'",
    "openai",
    "safetensors",
    # _____ Utils _____
    "ipykernel",
    "ipywidgets",
    "python-dotenv",
    "pyyaml",
    "tqdm",
    "matplotlib",
]


[tool.uv.sources]
torch = { index = "torch-cuda" }


[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
